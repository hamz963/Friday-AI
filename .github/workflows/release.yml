name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: friday.exe
            package_name: friday-windows-x64.zip
          - os: macos-latest
            artifact_name: friday
            package_name: friday-macos-x64.tar.gz
          - os: ubuntu-latest
            artifact_name: friday
            package_name: friday-linux-x64.tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Crate Target (Release Mode)
        run: cargo build --release -p friday-cli

      - name: Package Release Assets (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/release
          Compress-Archive -Path friday.exe -DestinationPath ../../${{ matrix.package_name }}

      - name: Package Release Assets (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/release
          tar -czf ../../${{ matrix.package_name }} ${{ matrix.artifact_name }}

      - name: Publish Build Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/${{ matrix.artifact_name }}
            ${{ matrix.package_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
