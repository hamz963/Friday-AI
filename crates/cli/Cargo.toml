[package]
name = "nova-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nova"
path = "src/main.rs"

[dependencies]
nova-core = { path = "../core" }
nova-llm = { path = "../llm" }
nova-memory = { path = "../memory" }
nova-plugins = { path = "../plugins" }
nova-agents = { path = "../agents" }
nova-desktop = { path = "../desktop" }
nova-browser = { path = "../browser" }
nova-voice = { path = "../voice" }
nova-files = { path = "../files" }
nova-refiner = { path = "../refiner" }
nova-generator = { path = "../generator" }
nova-terminal = { path = "../terminal" }
nova-git = { path = "../git" }
nova-diagnostics = { path = "../diagnostics" }
nova-api = { path = "../api" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
html2md = { workspace = true }
